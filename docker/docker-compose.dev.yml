services:
  web:
    stdin_open: true
    env_file:
      - ./web/.env
      - ./web/.env.local
    image: ghcr.io/st-mark-reformed/stmarkreformed.com-web
    container_name: stmark-web
    environment:
      HOSTNAME: stmark-web
      NODE_ENV: development
      NODE_OPTIONS: --inspect=0.0.0.0:9229
    healthcheck:
      disable: true
      test: '0'
    command:
      - "npm"
      - "run"
      - "dev"
    ports:
      - "14826:9229"
      - "14827:9230"
    volumes:
      - ./web/.bash_history:/root/.bash_history:delegated
      - ../web:/app:delegated
      - ../shared-files/filesAboveWebroot:/app/filesAboveWebroot
      - ../shared-files/uploads:/app/public/uploads
      - ../shared-files/files:/app/public/files
    expose:
      - 80
    networks:
      traefik:
      default:
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-dev_default
      - traefik.http.services.stmark_local.loadbalancer.server.port=80
      - traefik.http.routers.stmark_local.entrypoints=web
      - traefik.http.routers.stmark_local.rule=Host(`stmark.localtest.me`)
      - traefik.http.routers.stmark_local.middlewares=https-redirect
      - traefik.http.routers.stmark_local.service=stmark_local
      - traefik.http.routers.stmark_local-secure.entrypoints=websecure
      - traefik.http.routers.stmark_local-secure.tls=true
      - traefik.http.routers.stmark_local-secure.rule=Host(`stmark.localtest.me`)
      - traefik.http.routers.stmark_local-secure.service=stmark_local

  api:
    restart: always
    env_file:
      - api/.env
      - api/.env.local
    image: ghcr.io/st-mark-reformed/stmarkreformed.com-api
    container_name: stmark-api
    environment:
      ENABLE_XDEBUG: 1
      ENABLE_PHP_DEV_CONFIG: 1
      HOSTNAME: stmark-api
    volumes:
      - ./api/.bash_history:/root/.bash_history:delegated
      - ../api:/var/www:delegated
      - ../shared-files/uploads:/var/www/public/uploads
      - ../shared-files/filesAboveWebroot:/var/www/filesAboveWebroot
    networks:
      traefik:
      default:
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-dev_default
      - traefik.http.routers.stmark_api_local.entrypoints=web
      - traefik.http.routers.stmark_api_local.rule=Host(`api.stmark.localtest.me`)
      - traefik.http.routers.stmark_api_local.middlewares=https-redirect
      - traefik.http.routers.stmark_api_local-secure.entrypoints=websecure
      - traefik.http.routers.stmark_api_local-secure.tls=true
      - traefik.http.routers.stmark_api_local-secure.rule=Host(`api.stmark.localtest.me`)
    secrets:
      - RSA_PRIVATE_KEY
      - RSA_PUBLIC_KEY
    healthcheck:
      disable: true
      test: "1"

  api-queue-consumer-1:
    restart: always
    env_file:
      - ./api/.env
      - ./api/.env.local
    image: ghcr.io/st-mark-reformed/stmarkreformed.com-api-queue-consumer
    container_name: stmark-api-queue-consumer-1
    environment:
      HOSTNAME: api-queue-consumer-1
      ENABLE_XDEBUG: 0
      ENABLE_PHP_DEV_CONFIG: 0
    volumes:
      - ./api/.bash_history:/root/.bash_history:delegated
      - ../api:/var/www:delegated
      - ../shared-files/uploads:/var/www/public/uploads
      - ../shared-files/filesAboveWebroot:/var/www/filesAboveWebroot
    secrets:
      - RSA_PRIVATE_KEY
      - RSA_PUBLIC_KEY

  api-schedule-runner:
    restart: always
    env_file:
      - ./api/.env
      - ./api/.env.local
    image: ghcr.io/st-mark-reformed/stmarkreformed.com-api-schedule-runner
    container_name: stmark-api-schedule-runner
    environment:
      HOSTNAME: api-schedule-runner
      ENABLE_XDEBUG: 0
      ENABLE_PHP_DEV_CONFIG: 0
    volumes:
      - ./api/.bash_history:/root/.bash_history:delegated
      - ../api:/var/www:delegated
      - ../shared-files/uploads:/var/www/public/uploads
      - ../shared-files/filesAboveWebroot:/var/www/filesAboveWebroot
    secrets:
      - RSA_PRIVATE_KEY
      - RSA_PUBLIC_KEY

  auth:
    restart: always
    env_file:
      - auth/.env
      - auth/.env.local
    image: ghcr.io/st-mark-reformed/stmarkreformed.com-auth
    container_name: stmark-auth
    environment:
      ENABLE_XDEBUG: 0
      ENABLE_PHP_DEV_CONFIG: 1
      HOSTNAME: stmark-auth
    volumes:
      - ./auth/.bash_history:/root/.bash_history:delegated
      - ../auth:/var/www:delegated
    networks:
      traefik:
      default:
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-dev_default
      - traefik.http.routers.stmark_auth_local.entrypoints=web
      - traefik.http.routers.stmark_auth_local.rule=Host(`auth.stmark.localtest.me`)
      - traefik.http.routers.stmark_auth_local.middlewares=https-redirect
      - traefik.http.routers.stmark_auth_local-secure.entrypoints=websecure
      - traefik.http.routers.stmark_auth_local-secure.tls=true
      - traefik.http.routers.stmark_auth_local-secure.rule=Host(`auth.stmark.localtest.me`)
    secrets:
      - RSA_PRIVATE_KEY
      - RSA_PUBLIC_KEY
    healthcheck:
      disable: true
      test: "1"

  db:
    restart: always
    env_file:
      - db/.env
      - db/.env.local
    image: ghcr.io/st-mark-reformed/stmarkreformed.com-db
    container_name: stmark-db
    environment:
      HOSTNAME: stmark-db
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "44230:3306"
    volumes:
      - db-volume:/var/lib/mysql
    networks:
      traefik:
      default:
        aliases:
          - stmark-db

  redis:
    container_name: stmark-redis
    image: valkey/valkey:9
    command: valkey-server --appendonly yes --appendfsync everysec
    volumes:
      - redis-volume:/data
    networks:
      default:
        aliases:
          - stmark-redis

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.14.0
    container_name: stmark-elasticsearch
    environment:
      - cluster.name=es-docker-cluster
      - node.name=stmark-elasticsearch
      - cluster.initial_master_nodes=stmark-elasticsearch
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data-volume:/usr/share/elasticsearch/data
    expose:
      - "9200"
    networks:
      default:
        aliases:
          - stmark-elasticsearch

  mailhog:
    container_name: smrc-mailhog
    image: 'mailhog/mailhog:latest'
    user: root
    expose:
      - 49194
    ports:
      - "49194:49194"
    environment:
      - MH_API_BIND_ADDR=0.0.0.0:49194
      - MH_UI_BIND_ADDR=0.0.0.0:49194
    networks:
      default:
        aliases:
          - smrc-mailhog
    command: ["-storage=maildir", "-maildir-path=/maildir"]
    volumes:
      - mailhog_volume:/maildir
    labels:
      - traefik.enable=true
      - traefik.port=49194
      - traefik.docker.network=traefik-dev_default
      - traefik.http.routers.stmark_mailhog.entrypoints=web
      - traefik.http.routers.stmark_mailhog.rule=Host(`mailhog.stmark.localtest.me`)
      - traefik.http.routers.stmark_mailhog.middlewares=https-redirect
      - traefik.http.routers.stmark_mailhog-secure.entrypoints=websecure
      - traefik.http.routers.stmark_mailhog-secure.tls=true
      - traefik.http.routers.stmark_mailhog-secure.rule=Host(`mailhog.stmark.localtest.me`)
      - traefik.http.services.stmark_mailhog-secure.loadbalancer.server.port=49194

volumes:
  db-volume:
  elasticsearch-data-volume:
  mailhog_volume:
  redis-volume:

networks:
  traefik:
    name: traefik-dev_default
    external: true

secrets:
  RSA_PRIVATE_KEY:
    file: secrets/RSA_PRIVATE_KEY
  RSA_PUBLIC_KEY:
    file: secrets/RSA_PUBLIC_KEY
