name: Build images and deploy to production

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  IMAGE_NAMESPACE: ghcr.io/st-mark-reformed

jobs:
  changes:
    name: Detect changed images
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      auth: ${{ steps.filter.outputs.auth }}
      db: ${{ steps.filter.outputs.db }}
      utility: ${{ steps.filter.outputs.utility }}
      web: ${{ steps.filter.outputs.web }}
      queueConsumer: ${{ steps.filter.outputs.queueConsumer }}
      scheduleRunner: ${{ steps.filter.outputs.scheduleRunner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared: &shared
              - .dockerignore
              - docker/.profile
              - .github/**
            api:
              - *shared
              - api/**
              - docker/api/**
            auth:
              - *shared
              - auth/**
              - docker/auth/**
            db:
              - *shared
              - docker/db/**
            utility:
              - *shared
              - docker/utility/**
            web:
              - *shared
              - web/**
              - docker/web/**
            # The queue consumer and schedule runner are built on top of the
            # api image, so they rebuild whenever the api does
            queueConsumer:
              - *shared
              - api/**
              - docker/api/**
              - docker/api-queue-consumer/**
            scheduleRunner:
              - *shared
              - api/**
              - docker/api/**
              - docker/api-schedule-runner/**

  build-api:
    name: Build api image
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            api
            docker
            .github
      - name: Build and push
        uses: ./.github/actions/docker-build-push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          file: docker/api/Dockerfile
          cache-from: type=registry,ref=ghcr.io/st-mark-reformed/stmarkreformed.com-api
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/stmarkreformed.com-api
            ${{ env.IMAGE_NAMESPACE }}/stmarkreformed.com-api:${{ github.sha }}

  build-auth:
    name: Build auth image
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.auth == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            auth
            docker
            .github
      - name: Build and push
        uses: ./.github/actions/docker-build-push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          file: docker/auth/Dockerfile
          cache-from: type=registry,ref=ghcr.io/st-mark-reformed/stmarkreformed.com-auth
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/stmarkreformed.com-auth
            ${{ env.IMAGE_NAMESPACE }}/stmarkreformed.com-auth:${{ github.sha }}

  build-db:
    name: Build db image
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker
            .github
      - name: Build and push
        uses: ./.github/actions/docker-build-push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          file: docker/db/Dockerfile
          cache-from: type=registry,ref=ghcr.io/st-mark-reformed/stmarkreformed.com-db
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/stmarkreformed.com-db
            ${{ env.IMAGE_NAMESPACE }}/stmarkreformed.com-db:${{ github.sha }}

  build-utility:
    name: Build utility image
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.utility == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker
            .github
      - name: Build and push
        uses: ./.github/actions/docker-build-push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          file: docker/utility/Dockerfile
          cache-from: type=registry,ref=ghcr.io/st-mark-reformed/stmarkreformed.com-utility
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/stmarkreformed.com-utility
            ${{ env.IMAGE_NAMESPACE }}/stmarkreformed.com-utility:${{ github.sha }}

  build-web:
    name: Build web image
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            web
            docker
            .github
      - name: Build and push
        uses: ./.github/actions/docker-build-push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          file: docker/web/Dockerfile
          cache-from: type=registry,ref=ghcr.io/st-mark-reformed/stmarkreformed.com-web
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/stmarkreformed.com-web
            ${{ env.IMAGE_NAMESPACE }}/stmarkreformed.com-web:${{ github.sha }}

  build-api-dependent-queue-consumer:
    name: Build api-queue-consumer image
    needs:
      - changes
      - build-api
    if: ${{ !cancelled() && needs.build-api.result != 'failure' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.queueConsumer == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker
            .github
      - name: Build and push
        uses: ./.github/actions/docker-build-push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          file: docker/api-queue-consumer/Dockerfile
          build-args: |
            API_IMAGE=${{ env.IMAGE_NAMESPACE }}/stmarkreformed.com-api:${{ needs.build-api.result == 'success' && github.sha || 'latest' }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/stmarkreformed.com-api-queue-consumer
            ${{ env.IMAGE_NAMESPACE }}/stmarkreformed.com-api-queue-consumer:${{ github.sha }}

  build-api-dependent-schedule-runner:
    name: Build api-schedule-runner image
    needs:
      - changes
      - build-api
    if: ${{ !cancelled() && needs.build-api.result != 'failure' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.scheduleRunner == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker
            .github
      - name: Build and push
        uses: ./.github/actions/docker-build-push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          file: docker/api-schedule-runner/Dockerfile
          build-args: |
            API_IMAGE=${{ env.IMAGE_NAMESPACE }}/stmarkreformed.com-api:${{ needs.build-api.result == 'success' && github.sha || 'latest' }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/stmarkreformed.com-api-schedule-runner
            ${{ env.IMAGE_NAMESPACE }}/stmarkreformed.com-api-schedule-runner:${{ github.sha }}

  deploy:
    name: Deploy to production
    runs-on: Ivy
    # Images without changes skip their build and keep their current image, so
    # deploy whenever nothing failed rather than requiring every build to run.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    needs:
      - changes
      - build-api
      - build-auth
      - build-db
      - build-utility
      - build-web
      - build-api-dependent-queue-consumer
      - build-api-dependent-schedule-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker
            .github
      - name: Copy files to prod server
        uses: appleboy/scp-action@master
        with:
          username: ${{ vars.PROD_DEPLOY_SSH_USER }}
          host: ${{ vars.PROD_DEPLOY_SSH_HOST }}
          key: ${{ secrets.PROD_DEPLOY_SSH_PRIVATE_KEY }}
          source: "docker/db/.env, docker/web/.env, docker/api/.env, docker/auth/.env, docker/docker-compose.prod.yml, .github/workflows/migrate.sh"
          target: "/root/stmarkreformed.com"

      - name: Log in to prod server, pull images, deploy, and migrate
        uses: appleboy/ssh-action@master
        with:
          username: ${{ vars.PROD_DEPLOY_SSH_USER }}
          host: ${{ vars.PROD_DEPLOY_SSH_HOST }}
          key: ${{ secrets.PROD_DEPLOY_SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /root/stmarkreformed.com/docker;

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin;

            docker pull ghcr.io/st-mark-reformed/stmarkreformed.com-api;
            docker pull ghcr.io/st-mark-reformed/stmarkreformed.com-auth;
            docker pull ghcr.io/st-mark-reformed/stmarkreformed.com-api-queue-consumer;
            docker pull ghcr.io/st-mark-reformed/stmarkreformed.com-api-schedule-runner;
            docker pull ghcr.io/st-mark-reformed/stmarkreformed.com-db;
            docker pull ghcr.io/st-mark-reformed/stmarkreformed.com-utility;
            docker pull ghcr.io/st-mark-reformed/stmarkreformed.com-web;

            cat /root/stmarkreformed.com/docker/api/.env.local >> /root/stmarkreformed.com/docker/api/.env;
            cat /root/stmarkreformed.com/docker/auth/.env.local >> /root/stmarkreformed.com/docker/auth/.env;
            cat /root/stmarkreformed.com/docker/db/.env.local >> /root/stmarkreformed.com/docker/db/.env;
            cat /root/stmarkreformed.com/docker/web/.env.local >> /root/stmarkreformed.com/docker/web/.env;

            docker stack deploy \
              --compose-file docker-compose.prod.yml \
              --prune \
              --with-registry-auth \
              --resolve-image always \
              smrc;

            cd /root/stmarkreformed.com/.github/workflows;
            chmod +x ./migrate.sh;
            ./migrate.sh api;
            ./migrate.sh auth;
